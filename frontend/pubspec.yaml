name: ems_app
description: Employee Management System - Flutter App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & Networking
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.4

  # Navigation
  go_router: ^13.2.0

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # Location / GPS
  geolocator: ^12.0.0
  permission_handler: ^11.3.0

  # Date handling
  intl: ^0.19.0

  # Image & File
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  file_picker: ^8.0.3

  # Charts
  fl_chart: ^0.68.0

  # UI
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.0
  iconsax: ^0.0.8
  google_fonts: ^6.2.1
  badges: ^3.1.2

  # Notifications
  flutter_local_notifications: ^17.1.2

  # Utils
  shared_preferences: ^2.2.3
  url_launcher: ^6.2.6
  timeago: ^3.6.1
  equatable: ^2.0.5

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.20
