{% extends 'index.html' %}

{% block title %}
Logs
{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h3 class="card-title">Activity Logs</h3>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-responsive-md dataTable" id="employeeTable">
                <thead>
                    <tr>
                        <th>Action</th>
                        <th>Timestamp</th>
                    </tr>
                </thead>
                <tbody>
                    {% for action in log_entries %}
                    <tr>
                        <td>{{ action.action }}</td>
                        <td>{{ action.timestamp }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
