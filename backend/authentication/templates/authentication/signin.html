{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
     	<!--Title-->
	<title>EMS | Signin</title>

	<!-- Meta -->
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<!-- MOBILE SPECIFIC -->
	<meta name="viewport" content="width=device-width, initial-scale=1">
	
	<!-- FAVICONS ICON -->
	<link rel="shortcut icon" type="image/png" href="{% static 'images/favicon.png' %}">
	<link href="{% static 'vendor/bootstrap-select/dist/css/bootstrap-select.min.css' %}" rel="stylesheet">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0">
	<link rel="stylesheet" href="{% static 'vendor/toastr/css/toastr.min.css' %}">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>

<body class="body">
	<div class="authincation d-flex flex-column flex-lg-row flex-column-fluid">

		<div class="container flex-row-fluid d-flex flex-column justify-content-center position-relative overflow-hidden p-7 mx-auto">
			<div class="d-flex justify-content-center h-100 align-items-center">
				<div class="authincation-content style-2">
					<div class="row no-gutters">
						<div class="col-xl-12 tab-content">
							<div id="sign-up" class="auth-form tab-pane fade show active  form-validation">
								<form method="POST">
                                    {% csrf_token %}
									<div class="text-center mb-4">
										<h3 class="text-center mb-2 text-dark">Sign In</h3>
										<span>Streamlined HR, Effortless Management.</span>
									</div>
									
									<div class="mb-3">
										<label for="email_input" class="form-label required">Email address</label>
									  <input type="email" class="form-control" id="email_input" placeholder="hello@example.com" name="email" required>
									</div>
									<div class="mb-3 position-relative">
										<label class="form-label required" for="dlab-password">Password</label>
										<input type="password" id="dlab-password" class="form-control" placeholder="*******" name="password"  required>
									</div>
									<div class="form-row d-flex justify-content-between mt-4 mb-2">
										<div class="mb-4">
											<a  class="btn-link text-primary">Forgot Password?</a>
										</div>
									</div>
									<button class="btn btn-block btn-primary">Sign In</button>
									
								</form>
								<div class="new-account mt-3 text-center">
									<p class="font-w500">Don't have an account yet? <a class="text-primary" href="{% url 'authentication:signup' %}" data-toggle="tab">Sign up</a></p>
								</div>
							</div>
								<div class="d-flex align-items-center justify-content-center">
									<a href="javascript:void(0);" class="text-primary">Terms</a>
									<a href="javascript:void(0);" class="text-primary mx-5">Plans</a>
									<a href="javascript:void(0);" class="text-primary">Contact Us</a>
								</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

    <!--**********************************
        Scripts
    ***********************************-->
    <!-- Required vendors -->
    <script src="{% static 'vendor/global/global.min.js' %}"></script>
	<script src="{% static 'vendor/bootstrap-select/dist/js/bootstrap-select.min.js' %}"></script>
	<script src="{% static 'js/custom.min.js' %}"></script>
	<script src="{% static 'js/dlabnav-init.js' %}"></script>
   <!-- Toastr -->
   <script src="{% static 'vendor/toastr/js/toastr.min.js' %}"></script>

   <!-- All init script -->
   <script src="{% static 'js/plugins-init/toastr-init.js' %}"></script>

   {% include 'toastr.html' %}
    
</body>
</html>
