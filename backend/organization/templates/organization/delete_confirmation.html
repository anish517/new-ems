{% extends 'index.html' %}

{% block title %}
Delete confirmation
{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <h5 class="card-title">Delete confirmation</h5>
        <p class="card-text">
            Are you sure you want to delete?
        </p>

        <a class="btn btn-sm btn-success me-3" href="{{ cancel_redirect_url }}">Cancel</a>
        <form method="POST" style="display: inline;" class="ml-2">
            {% csrf_token %}
            <button class="btn btn-sm btn-danger" type="submit">Delete</button>
        </form>
    </div>
</div>
{% endblock %}
