# /etc/nginx/sites-available/ems  ->  symlink into sites-enabled
# EMS: Django API proxied to gunicorn, Flutter web bundle served statically.
# HTTP only here on purpose: `certbot --nginx -d ems.omwaytechnologies.com` adds the
# 443 block and the redirect once DNS points at this host (HTTP-01 needs that).
server {
    listen 80;
    listen [::]:80;
    server_name ems.omwaytechnologies.com;

    # Attendance selfies and leave/policy documents.
    client_max_body_size 25m;

    access_log /srv/ems/logs/nginx-access.log;
    error_log  /srv/ems/logs/nginx-error.log;

    location /static/ { alias /srv/ems/static/; expires 30d; access_log off; }
    location /media/  { alias /srv/ems/media/;  expires 7d; }

    # Flutter web bundle lives at /srv/ems/www/app/. The app uses hash routing, so no
    # deep-link rewrite is strictly required; the index fallback mirrors the cPanel .htaccess.
    location = /app { return 301 /app/; }
    location /app/ {
        root /srv/ems/www;
        try_files $uri $uri/ /app/index.html;
    }
    # Never cache the entry points; everything else in the bundle is safe to cache.
    location ~ ^/app/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js)$ {
        root /srv/ems/www;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Everything else (API, admin, legacy HTML UI, and Django's / -> /app/ redirect).
    location / {
        proxy_pass http://unix:/srv/ems/run/gunicorn.sock;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
